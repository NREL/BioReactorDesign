name: bird-CI

on:
   push:
     branches: [main]
     paths-ignore:
      - '*.md'
      - '*.rst'
      - 'README*'
      - 'LICENSE'
      - 'docs/**'

   pull_request:
     branches: [main]
     paths-ignore:
      - '*.md'
      - '*.rst'
      - 'README*'
      - 'LICENSE'
      - 'docs/**'

permissions:
  contents: read

jobs:
  Lint:
    name: Lint (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        os: ['ubuntu-latest']
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: ${{github.workspace}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          cache: 'pip'

      - name: Cache Nox
        uses: actions/cache@v4
        with:
          path: .nox
          key: ${{ runner.os }}-lint-nox-${{ hashFiles('noxfile.py') }}

      - name: Install nox
        run: pip install nox

      - name: Formatting and sorting import
        run: nox -s linter

      - name: Spellcheck
        run: nox -s spell

  Unit-Test-BiRD:
    name: Unit-Test-BiRD (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
        os: ['ubuntu-latest', 'macos-latest']
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: ${{github.workspace}}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: test-env
          create-args: >-
            python=${{ matrix.python-version }}
            paraview=6.1
            hdf5=1.14
          channels: conda-forge
          channel-priority: strict
          cache-downloads: true
          cache-env: true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade nox
          pip install .[tests] 

      - name: Test
        run: nox -s tests -- no-reports

  Unit-Test-pixi-BiRD:
    name: Unit-Test-pixi-BiRD (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: ${{github.workspace}}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.62.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Test
        run: |
          pixi run test

  Unit-Test-pypi-Bird:
    name: Unit-Test-pypi-BiRD (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        os: ['ubuntu-latest']
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: ${{github.workspace}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: test-env
          create-args: >-
            python=${{ matrix.python-version }}
            paraview=6.1
            hdf5=1.14
          channels: conda-forge
          channel-priority: strict
          cache-downloads: true
          cache-env: true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade nox
          pip install nlr-bird[tests]

      - name: Test
        run: nox -s tests -- no-reports

  Regression-Test-OF9:
    name: Regression-Test-OF9 (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        os: ['ubuntu-22.04']
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: ${{github.workspace}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
      - uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 9

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: test-env
          create-args: >-
            python=${{ matrix.python-version }}
            paraview=6.1
            hdf5=1.14
          channels: conda-forge
          channel-priority: strict
          cache-downloads: true
          cache-env: true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .

      - name: Compile solver
        run: |
          cd OFsolvers/OF9/birdmultiphaseEulerFoam
          export WM_COMPILE_OPTION=Debug
          ./Allwmake
      - name: Run deckwer17 PBE
        run: |
          cd experimental_cases/OF9/deckwer17
          bash run.sh 
      - name: Run deckwer17 constantD
        run: |
          cd experimental_cases/OF9/deckwer17
          cp constant/phaseProperties_constantd constant/phaseProperties
          bash run.sh 
      - name: Run deckwer19 PBE
        run: |
          cd experimental_cases/OF9/deckwer19
          bash run.sh 
      - name: Run Uloop Exp1
        run: |
          cd experimental_cases/OF9/uloop_valadbeigy_exp1
          bash run.sh 
      - name: Run Uloop Exp2
        run: |
          cd experimental_cases/OF9/uloop_valadbeigy_exp2
          bash run.sh 
      - name: Run Uloop Exp3
        run: |
          cd experimental_cases/OF9/uloop_valadbeigy_exp3
          bash run.sh 
      - name: Run side sparger tutorial
        run: |
          cd tutorial_cases/OF9/side_sparger
          bash run.sh 
      - name: Run bubble column tutorial
        run: |
          cd tutorial_cases/OF9/bubble_column_20L
          bash run.sh 
      - name: Run stirred-tank tutorial
        run: |
          cd tutorial_cases/OF9/stirred_tank
          bash run.sh 
      - name: Run reactive loop reactor tutorial
        run: |
          cd tutorial_cases/OF9/loop_reactor_reacting
          bash run.sh 
      - name: Run mixing loop reactor tutorial
        run: |
          cd tutorial_cases/OF9/loop_reactor_mixing
          bash run.sh
      - name: Run mixing loop reactor with swirl tutorial
        run: |
          cd tutorial_cases/OF9/loop_reactor_mixing_swirl
          bash run.sh
      - name: Run mixing loop reactor with static mixer tutorial
        run: |
          cd tutorial_cases/OF9/loop_reactor_mixing_static
          bash run.sh
      - name: Run airlift reactor tutorial
        run: |
          cd tutorial_cases/OF9/airlift_40m
          bash run.sh
      - name: Run flat panel reactor tutorial
        run: |
          cd tutorial_cases/OF9/FlatPanel_250L_ASU
          bash run.sh
          
  Regression-Test-OF13:
    name: Regression-Test-OF13 (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        os: ['ubuntu-22.04']
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: ${{github.workspace}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
      - uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 13

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: test-env
          create-args: >-
            python=${{ matrix.python-version }}
            paraview=6.1
            hdf5=1.14
          channels: conda-forge
          channel-priority: strict
          cache-downloads: true
          cache-env: true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .

      - name: Compile solver
        run: |
          cd OFsolvers/OF13/birdmultiphaseEuler
          export WM_COMPILE_OPTION=Debug
          ./Allwmake
      - name: Run bubble column
        run: |
          cd tutorial_cases/OF13/bubble_column
          ./Allrun --test 
      - name: STR MRF
        run: |
          cd tutorial_cases/OF13/STR_MRF
          ./Allrun --test 
      - name: STR rotating mesh
        run: |
          cd tutorial_cases/OF13/STR_rotatingMesh
          ./Allrun --test 

  Regression-Test-OF9-pixi:
    name: Regression-Test-OF9-pixi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04']
    defaults:
      run:
        shell: bash -leo pipefail {0}
        working-directory: ${{github.workspace}}
    steps:
      - uses: actions/checkout@v4
      - uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 9
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.62.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Compile solver
        run: |
          cd OFsolvers/OF9/birdmultiphaseEulerFoam
          export WM_COMPILE_OPTION=Debug
          ./Allwmake
      - name: Run bubble column tutorial
        run: |
          cd tutorial_cases/OF9/bubble_column_20L
          bash run_pixi.sh 

